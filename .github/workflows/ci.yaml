name: CI
on:
    pull_request:

jobs:
    check-guidelines:
        name: Check Guidelines
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7

            - uses: swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
              with:
                  workspaces: './src-tauri -> target'

            # The ONNX Runtime build script downloads a prebuilt binary that
            # the rust cache does not cover. Without this cache a transient
            # network failure in that download fails the mandatory Clippy gate.
            - name: Cache the ONNX Runtime prebuilt binaries
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ort.pyke.io
                  key: ort-pyke-${{ hashFiles('src-tauri/Cargo.lock') }}
                  restore-keys: ort-pyke-

            - name: Validate the workflow definitions
              shell: bash
              run: |
                  python3 -m pip install --quiet --disable-pip-version-check pyyaml
                  python3 scripts/validate-workflows.py

            - name: Install pnpm
              run: npm install -g pnpm@10.19.0 --ignore-scripts

            - name: Install Linux deps (official + extras)
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libayatana-appindicator3-dev \
                    librsvg2-dev \
                    patchelf \
                    libasound2-dev \
                    libxdo-dev \
                    unzip \
                    build-essential \
                    curl \
                    wget \
                    file \
                    libssl-dev

            - name: Download & extract ONNX model (Linux)
              shell: bash
              run: |
                  set -euo pipefail
                  url="https://github.com/Kieirra/murmure-model/releases/download/1.3.0/parakeet-tdt-0.6b-v3-int8.zip"
                  tmp="/tmp/model.zip"
                  echo "Downloading $url"
                  curl --proto '=https' -L -o "$tmp" "$url"
                  echo "Unzipping into ./resources"
                  unzip -o "$tmp" -d resources
                  ls -al resources

            - name: Install frontend deps
              run: pnpm install --ignore-scripts

            - name: Type check
              shell: bash
              run: pnpm exec tsc --noEmit

            - name: Build SmartMic frontend
              run: pnpm build:smartmic

            - name: Clippy
              shell: bash
              run: |
                  set -uo pipefail
                  # The ONNX Runtime prebuilt binary is fetched during the
                  # build. A dropped connection there is a network fault, not
                  # a code fault, so the gate is retried before it fails.
                  for attempt in 1 2 3; do
                      if pnpm run clippy; then
                          exit 0
                      fi
                      echo "Clippy attempt $attempt failed; retrying after a possible download fault."
                      sleep 20
                  done
                  echo "Clippy failed after 3 attempts."
                  exit 1

            - name: Pocket TTS text, preview and preference unit tests
              shell: bash
              run: |
                  set -euo pipefail
                  cargo test --manifest-path src-tauri/Cargo.toml --lib tts::
                  cargo test --manifest-path src-tauri/Cargo.toml --lib commands::settings::pocket_tts_settings_tests
                  cargo test --manifest-path src-tauri/Cargo.toml --lib settings::settings::tests
                  cargo test --manifest-path src-tauri/Cargo.toml --lib commands::shortcuts::tts_shortcut_tests
                  cargo test --manifest-path src-tauri/Cargo.toml --lib shortcuts::registry::tests

            - name: Lint
              run: pnpm run lint

    pocket-tts-windows-smoke:
        name: Pocket TTS official Windows CLI
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - name: Validate pinned Kyutai CPU executable and command line
              shell: pwsh
              run: |
                  ./scripts/verify-pocket-tts-windows.ps1 -Destination "$env:RUNNER_TEMP/pocket-tts-smoke"

    pocket-tts-model-isolation:
        name: Pocket TTS model cache isolation contract
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Validate the Pocket TTS model cache isolation
              shell: pwsh
              run: ./scripts/test-pocket-tts-model-cache.ps1
            - name: Validate the Pocket TTS WAV structural contract
              shell: pwsh
              run: ./scripts/test-pocket-tts-wave-validator.ps1

    pocket-tts-french-audio:
        name: Pocket TTS real French WAV on Windows
        runs-on: windows-latest
        timeout-minutes: 25
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
            - name: Generate genuine local French CPU audio and validate WAV
              shell: pwsh
              env:
                  HF_HUB_DISABLE_TELEMETRY: '1'
              run: |
                  ./scripts/verify-pocket-tts-windows.ps1 -Destination "$env:RUNNER_TEMP/pocket-tts-french" -GenerateFrench

    pocket-tts-offline-cache-windows:
        name: Pocket TTS cached French WAV without network
        runs-on: windows-latest
        timeout-minutes: 25
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
            - name: Block binary outbound access after caching and generate French WAV
              shell: pwsh
              run: |
                  ./scripts/test-pocket-tts-offline-windows.ps1 -Destination "$env:RUNNER_TEMP/pocket-tts-offline"

    # A full local round trip: the pinned Pocket TTS runtime produces French
    # speech and the pinned Parakeet model transcribes it. It proves the STT
    # path really recognises French audio, not only that it compiles.
    pocket-tts-stt-roundtrip:
        name: Pocket TTS to Parakeet French round trip
        runs-on: windows-latest
        timeout-minutes: 40
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
            - name: Setup Rust
              uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7
            - uses: swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
              with:
                  workspaces: './src-tauri -> target'
            - name: Install pnpm
              run: npm install -g pnpm@10.19.0 --ignore-scripts
              shell: pwsh
            - name: Download & extract ONNX model (Windows)
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force -Path resources | Out-Null
                  $zip = Join-Path $env:RUNNER_TEMP "model.zip"
                  Invoke-WebRequest -Uri "https://github.com/Kieirra/murmure-model/releases/download/1.3.0/parakeet-tdt-0.6b-v3-int8.zip" -OutFile $zip
                  Expand-Archive -Path $zip -DestinationPath resources -Force
            - name: Install frontend deps
              run: pnpm install --ignore-scripts
              shell: pwsh
            - name: Build the local frontend resources
              # The Tauri build script refuses to run when the SmartMic
              # resources are missing, so they are built before the crate.
              run: pnpm build:smartmic
              shell: pwsh
            - name: Generate real French speech and transcribe it with the pinned model
              shell: pwsh
              env:
                  HF_HUB_DISABLE_TELEMETRY: '1'
              run: |
                  $destination = Join-Path $env:RUNNER_TEMP 'murmure-stt-roundtrip'
                  $wav = Join-Path $destination 'french-smoke.wav'
                  try {
                      ./scripts/verify-pocket-tts-windows.ps1 -Destination $destination -GenerateFrench -KeepGeneratedWav
                      if (-not (Test-Path -LiteralPath $wav)) { throw 'Generated French WAV missing' }
                      $env:MURMURE_STT_FIXTURE_WAV = $wav
                      $env:MURMURE_STT_MODEL_DIR = Join-Path $env:GITHUB_WORKSPACE 'resources\parakeet-tdt-0.6b-v3-int8'
                      $env:MURMURE_STT_TOKENIZER = Join-Path $env:GITHUB_WORKSPACE 'resources\tokenizer.json'
                      cargo test --manifest-path src-tauri/Cargo.toml --lib engine::real_audio_tests::real_french_speech_is_transcribed -- --exact --ignored --nocapture
                      if ($LASTEXITCODE -ne 0) { throw 'The real French round trip failed' }
                  } finally {
                      Remove-Item -LiteralPath $wav -Force -ErrorAction SilentlyContinue
                      Remove-Item Env:MURMURE_STT_FIXTURE_WAV -ErrorAction SilentlyContinue
                  }

    # The RustSec advisory database is checked against the exact lock file, so
    # a vulnerable transitive dependency cannot reach a release unnoticed.
    #
    # The advisories listed below are the ones whose fix needs a major
    # upgrade of a parent dependency that this fork does not own. Each one is
    # listed with the reason it is not reachable here, and each one is
    # tracked. Any advisory that is not listed still fails the job, so a new
    # vulnerability can never slip through.
    #
    #   RUSTSEC-2026-0194, RUSTSEC-2026-0195  quick-xml: the XML parser
    #       of a dependency that needs 0.41; the application parses no
    #       untrusted XML.
    #   RUSTSEC-2026-0235  rkyv: needs 0.8, the parent allows 0.7 only.
    #   RUSTSEC-2026-0367, RUSTSEC-2026-0368, RUSTSEC-2026-0369  zip: the
    #       Tauri updater plugin still requires zip 4; the application never
    #       calls ZipArchive::extract, it copies the bytes of one
    #       name-matched entry to a fixed destination.
    #   RUSTSEC-2024-0429  glib: Linux only, and the affected
    #       VariantStrIter is not used.
    #   RUSTSEC-2026-0097  rand: a build time dependency, and the unsoundness
    #       needs a custom logger that re-enters the random generator.
    dependency-audit:
        name: Dependency audit
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # The action publishes its result as a check run.
            checks: write
        steps:
            - uses: actions/checkout@v4
            - name: Check the Rust dependencies against the RustSec advisories
              uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  working-directory: src-tauri
                  ignore: >-
                    RUSTSEC-2026-0194,
                    RUSTSEC-2026-0195,
                    RUSTSEC-2026-0235,
                    RUSTSEC-2026-0367,
                    RUSTSEC-2026-0368,
                    RUSTSEC-2026-0369,
                    RUSTSEC-2024-0429,
                    RUSTSEC-2026-0097

    # A green pipeline must never hide a skipped real-audio validation. The
    # two jobs above are the only evidence that Pocket TTS really synthesizes
    # French speech on the target platform, so a skipped or cancelled result
    # is a qualification failure, not a neutral outcome.
    pocket-tts-audio-qualification:
        name: Pocket TTS audio qualification gate
        needs: [pocket-tts-french-audio, pocket-tts-offline-cache-windows]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Fail when a critical real-audio job did not succeed
              env:
                  FRENCH_AUDIO_RESULT: ${{ needs.pocket-tts-french-audio.result }}
                  OFFLINE_AUDIO_RESULT: ${{ needs.pocket-tts-offline-cache-windows.result }}
              run: |
                  set -euo pipefail
                  failed=0
                  if [ "$FRENCH_AUDIO_RESULT" != "success" ]; then
                      echo "::error::Critical job 'Pocket TTS real French WAV on Windows' result=${FRENCH_AUDIO_RESULT}"
                      failed=1
                  fi
                  if [ "$OFFLINE_AUDIO_RESULT" != "success" ]; then
                      echo "::error::Critical job 'Pocket TTS cached French WAV without network' result=${OFFLINE_AUDIO_RESULT}"
                      failed=1
                  fi
                  if [ "$failed" -ne 0 ]; then
                      echo "Real Pocket TTS audio evidence is missing; the stack is NOT audio-qualified."
                      exit 1
                  fi
                  echo "Both critical Pocket TTS audio jobs ran and succeeded."

    packaged-windows:
        name: Packaged Windows application
        runs-on: windows-latest
        timeout-minutes: 60
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7

            - uses: swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
              with:
                  workspaces: './src-tauri -> target'

            - name: Install pnpm
              run: npm install -g pnpm@10.19.0 --ignore-scripts
              shell: pwsh

            - name: Download & extract ONNX model (Windows)
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force -Path resources | Out-Null
                  $zip = Join-Path $env:RUNNER_TEMP "model.zip"
                  Invoke-WebRequest -Uri "https://github.com/Kieirra/murmure-model/releases/download/1.3.0/parakeet-tdt-0.6b-v3-int8.zip" -OutFile $zip
                  Expand-Archive -Path $zip -DestinationPath resources -Force

            - name: Install frontend deps
              run: pnpm install --ignore-scripts
              shell: pwsh

            # The NSIS bundle is what a user actually installs. Compiling the
            # binary alone never proves that the installer works.
            - name: Build the packaged Windows application
              run: pnpm tauri build --bundles nsis
              shell: pwsh

            - name: Install, launch and uninstall the packaged application
              shell: pwsh
              run: ./scripts/validate-packaged-windows.ps1

    # The real French WAV is decoded and driven through the production Rodio
    # transport, so the playback contract is proven on real audio and not only
    # on an in-memory fixture.
    pocket-tts-real-wav-rodio:
        name: Pocket TTS real French WAV decoded by Rodio
        runs-on: windows-latest
        timeout-minutes: 40
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
            - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7
            - uses: swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
              with:
                  workspaces: './src-tauri -> target'
            - name: Build required local frontend resources
              shell: pwsh
              run: |
                  npm install -g pnpm@10.19.0 --ignore-scripts
                  if ($LASTEXITCODE -ne 0) { throw 'pnpm installation failed' }
                  pnpm install --ignore-scripts
                  if ($LASTEXITCODE -ne 0) { throw 'Frontend dependency installation failed' }
                  pnpm build:smartmic
                  if ($LASTEXITCODE -ne 0) { throw 'SmartMic build failed' }
            - name: Decode official generated French WAV and test Rodio controls
              shell: pwsh
              env:
                  HF_HUB_DISABLE_TELEMETRY: '1'
              run: |
                  $destination = Join-Path $env:RUNNER_TEMP 'murmure-rodio-wav'
                  $wav = Join-Path $destination 'french-smoke.wav'
                  try {
                      ./scripts/verify-pocket-tts-windows.ps1 -Destination $destination -GenerateFrench -KeepGeneratedWav
                      if (-not (Test-Path -LiteralPath $wav)) { throw 'Generated French WAV missing' }
                      $env:MURMURE_TTS_FIXTURE_WAV = $wav
                      cargo test --manifest-path src-tauri/Cargo.toml --lib tts::preview::tests::official_french_wav_decodes_with_the_production_decoder -- --exact --ignored --nocapture
                      if ($LASTEXITCODE -ne 0) { throw 'Official French WAV Rodio transport contract failed' }
                  } finally {
                      Remove-Item -LiteralPath $wav -Force -ErrorAction SilentlyContinue
                      Remove-Item Env:MURMURE_TTS_FIXTURE_WAV -ErrorAction SilentlyContinue
                  }

    compile-linux:
        uses: ./.github/workflows/build-linux.yml
        with:
            dry: true

    compile-windows:
        uses: ./.github/workflows/build-windows.yml
        with:
            dry: true

    compile-macos:
        uses: ./.github/workflows/build-macos.yml
        with:
            dry: true
